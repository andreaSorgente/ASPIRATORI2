<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selezionatore Aspiratore</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #13161e;
    --border: #1e2535;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --text: #c8d6e5;
    --text-dim: #4a5568;
    --text-bright: #eaf2ff;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow Condensed', sans-serif;
    --success: #00e676;
    --warning: #ffab40;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 40px 20px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,229,255,0.03) 39px, rgba(0,229,255,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,229,255,0.03) 39px, rgba(0,229,255,0.03) 40px);
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    border-left: 3px solid var(--accent);
    padding-left: 18px;
    margin-bottom: 40px;
    animation: slideIn 0.5s ease;
  }

  header .label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  header h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 1px;
    line-height: 1.1;
  }

  header p {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 6px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 24px;
    position: relative;
    animation: fadeUp 0.4s ease both;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .card.blue::before { background: var(--accent); }
  .card.orange::before { background: var(--accent2); }

  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.2s; }

  .card-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .card.blue .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .card.orange .dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field-row {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    background: var(--bg);
    transition: border-color 0.2s;
  }

  .field-row:focus-within { border-color: var(--accent); }
  .card.orange .field-row:focus-within { border-color: var(--accent2); }

  .field-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 16px;
    padding: 10px 14px;
  }

  .field-row input::placeholder { color: var(--text-dim); font-size: 13px; }

  .field-row .unit {
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: rgba(255,255,255,0.03);
    border-left: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .btn {
    width: 100%;
    padding: 13px 20px;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-blue {
    background: var(--accent);
    color: #000;
  }

  .btn-blue:hover {
    background: #fff;
    box-shadow: 0 0 20px rgba(0,229,255,0.4);
  }

  .btn-orange {
    background: var(--accent2);
    color: #000;
  }

  .btn-orange:hover {
    background: #fff;
    box-shadow: 0 0 20px rgba(255,107,53,0.4);
  }

  .btn:active { transform: scale(0.98); }

  /* Results */
  .results-section {
    animation: fadeUp 0.4s ease 0.3s both;
  }

  .results-header {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .results-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .result-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px 24px;
    min-height: 90px;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .result-box::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--text-dim);
    transition: background 0.3s;
  }

  .result-box.has-result::before { background: var(--success); box-shadow: 0 0 10px var(--success); }
  .result-box.has-error::before { background: var(--warning); }

  .result-placeholder {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
  }

  .result-content {
    width: 100%;
  }

  .result-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    gap: 12px;
  }

  .result-item:last-child { border-bottom: none; }

  .result-sheet {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    min-width: 120px;
  }

  .result-value {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--success);
    text-align: right;
    word-break: break-all;
  }

  .result-value.warn { color: var(--warning); }

  .portata-result {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .portata-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: var(--mono);
  }

  .error-toast {
    display: none;
    background: rgba(255,107,53,0.1);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 16px;
    letter-spacing: 1px;
    animation: fadeUp 0.2s ease;
  }

  .error-toast.show { display: block; }

  /* File Upload */
  .upload-zone {
    border: 1px dashed var(--border);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
    margin-bottom: 20px;
    animation: fadeUp 0.4s ease 0.05s both;
  }

  .upload-zone:hover { border-color: var(--accent); background: rgba(0,229,255,0.03); }
  .upload-zone.active { border-color: var(--accent); border-style: solid; background: rgba(0,229,255,0.06); }

  .upload-zone input { display: none; }

  .upload-icon {
    font-size: 28px;
    margin-bottom: 8px;
    opacity: 0.4;
  }

  .upload-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .upload-text span { color: var(--accent); cursor: pointer; }
  .upload-filename {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--success);
    margin-top: 6px;
  }

  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="label">// sistema selezione</div>
    <h1>Selezionatore Aspiratore</h1>
    <p>calcolo portata · ricerca modello · analisi curve</p>
  </header>

  <!-- File Upload -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept=".xlsx,.xls">
    <div class="upload-icon">📂</div>
    <div class="upload-text">
      <span>Carica file Excel</span> &nbsp;·&nbsp; RH.xlsx
    </div>
    <div class="upload-filename" id="uploadFilename"></div>
  </div>

  <div class="error-toast" id="errorToast"></div>

  <div class="grid">
    <!-- Selezione Aspiratore -->
    <div class="card blue">
      <div class="card-title"><div class="dot"></div>Selezione Aspiratore</div>

      <div class="field">
        <label>Portata</label>
        <div class="field-row">
          <input type="number" id="portata" placeholder="es. 500" step="any">
          <div class="unit">m³/h</div>
        </div>
      </div>

      <div class="field">
        <label>Perdita di carico</label>
        <div class="field-row">
          <input type="number" id="prevalenza" placeholder="es. 100" step="any">
          <div class="unit">mmcaH₂O</div>
        </div>
      </div>

      <button class="btn btn-blue" onclick="trovaAspiratore()">
        ⚙ Trova Aspiratore
      </button>
    </div>

    <!-- Calcolo Portata -->
    <div class="card orange">
      <div class="card-title"><div class="dot"></div>Calcolo Portata</div>

      <div class="field">
        <label>Velocità</label>
        <div class="field-row">
          <input type="number" id="velocita" placeholder="es. 12.5" step="any">
          <div class="unit">m/s</div>
        </div>
      </div>

      <div class="field">
        <label>Diametro</label>
        <div class="field-row">
          <input type="number" id="diametro" placeholder="es. 200" step="any">
          <div class="unit">mm</div>
        </div>
      </div>

      <button class="btn btn-orange" onclick="calcolaPortata()">
        ⟳ Calcola Portata
      </button>
    </div>
  </div>

  <!-- Risultati -->
  <div class="results-section">
    <div class="results-header">Risultati</div>
    <div class="result-box" id="resultBox">
      <div class="result-placeholder">— i risultati appariranno qui —</div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ── State ──────────────────────────────────────────────
let aspiratoriDict = {};   // { sheetName: [ [col0,col1,...], [...], ... ] }
let hasFile = false;

// ── File Upload ────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const workbook = XLSX.read(ev.target.result, { type: 'binary' });
      aspiratoriDict = {};
      workbook.SheetNames.forEach(name => {
        const ws = workbook.Sheets[name];
        aspiratoriDict[name] = XLSX.utils.sheet_to_json(ws, { header: 1 });
      });
      hasFile = true;
      document.getElementById('uploadFilename').textContent = '✓ ' + file.name;
      document.getElementById('uploadZone').classList.add('active');
      showInfo('File caricato: ' + Object.keys(aspiratoriDict).length + ' fogli trovati');
    } catch(err) {
      showError('Errore nel caricamento del file Excel');
    }
  };
  reader.readAsBinaryString(file);
});

// ── Helpers ────────────────────────────────────────────
function showError(msg) {
  const t = document.getElementById('errorToast');
  t.textContent = '⚠ ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

function showInfo(msg) {
  const t = document.getElementById('errorToast');
  t.style.background = 'rgba(0,230,118,0.08)';
  t.style.borderColor = 'var(--success)';
  t.style.color = 'var(--success)';
  t.textContent = '✓ ' + msg;
  t.classList.add('show');
  setTimeout(() => {
    t.classList.remove('show');
    t.style.background = '';
    t.style.borderColor = '';
    t.style.color = '';
  }, 3000);
}

// ── Core Logic (replicates Python) ────────────────────
function parseSheetColumns(rows) {
  // rows[0] = header row; columns[5:] are numeric (portata values)
  if (!rows || rows.length < 2) return null;
  const header = rows[0];
  const numericCols = [];
  for (let i = 5; i < header.length; i++) {
    const v = parseFloat(header[i]);
    if (!isNaN(v)) numericCols.push({ index: i, value: v });
  }
  return { header, numericCols, rows };
}

function trovaAspiratoreSingle(sheet, portata, prevalenza) {
  const parsed = parseSheetColumns(sheet);
  if (!parsed) return null;
  const { header, numericCols, rows } = parsed;

  const minPortata = Math.min(...numericCols.map(c => c.value));
  if (portata < minPortata) return 'portata troppo piccola per questo aspiratore';

  // Closest column
  let bestCol = numericCols.reduce((a, b) =>
    Math.abs(b.value - portata) < Math.abs(a.value - portata) ? b : a
  );

  // Find row where diff >= 0, closest to prevalenza
  let bestRow = null;
  let bestDiff = Infinity;
  for (let r = 1; r < rows.length; r++) {
    const cellVal = parseFloat(rows[r][bestCol.index]);
    if (isNaN(cellVal)) continue;
    const diff = cellVal - prevalenza;
    if (diff >= 0 && diff < bestDiff) {
      bestDiff = diff;
      bestRow = r;
    }
  }
  if (bestRow === null) return 'nessun aspiratore adatto trovato';
  return rows[bestRow][0];  // column "1" = index 0
}

function trovaAspiratore() {
  const q = parseFloat(document.getElementById('portata').value);
  const p = parseFloat(document.getElementById('prevalenza').value);
  if (isNaN(q) || isNaN(p)) { showError('Inserisci numeri validi!'); return; }

  const box = document.getElementById('resultBox');

  if (!hasFile || Object.keys(aspiratoriDict).length === 0) {
    // Demo mode
    box.className = 'result-box has-result';
    box.innerHTML = `
      <div class="result-content">
        <div class="result-item">
          <div class="result-sheet">// INFO</div>
          <div class="result-value warn">Carica un file Excel per risultati reali</div>
        </div>
        <div class="result-item">
          <div class="result-sheet">Q inserita</div>
          <div class="result-value">${q.toFixed(1)} m³/h</div>
        </div>
        <div class="result-item">
          <div class="result-sheet">ΔP inserita</div>
          <div class="result-value">${p.toFixed(1)} mmcaH₂O</div>
        </div>
      </div>`;
    return;
  }

  const risultati = {};
  for (const [nome, sheet] of Object.entries(aspiratoriDict)) {
    risultati[nome] = trovaAspiratoreSingle(sheet, q, p);
  }

  let html = '<div class="result-content">';
  for (const [nome, valore] of Object.entries(risultati)) {
    const cls = (typeof valore === 'string' && valore.includes('troppo')) ? 'warn' : '';
    html += `<div class="result-item">
      <div class="result-sheet">${nome}</div>
      <div class="result-value ${cls}">${valore ?? '—'}</div>
    </div>`;
  }
  html += '</div>';
  box.className = 'result-box has-result';
  box.innerHTML = html;
}

function calcolaPortata() {
  const v = parseFloat(document.getElementById('velocita').value);
  const d = parseFloat(document.getElementById('diametro').value);
  if (isNaN(v) || isNaN(d)) { showError('Inserisci numeri validi!'); return; }

  const dM = d / 1000;
  const q = (dM * dM * v * Math.PI / 4) * 3600;

  const box = document.getElementById('resultBox');
  box.className = 'result-box has-result';
  box.innerHTML = `
    <div>
      <div class="portata-result">${q.toFixed(2)} m³/h</div>
      <div class="portata-label">PORTATA CALCOLATA &nbsp;·&nbsp; ø ${d} mm &nbsp;·&nbsp; v ${v} m/s</div>
    </div>`;

  // Populate portata field for convenience
  document.getElementById('portata').value = q.toFixed(2);
}

// Enter key support
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const active = document.activeElement;
    if (['portata','prevalenza'].includes(active.id)) trovaAspiratore();
    if (['velocita','diametro'].includes(active.id)) calcolaPortata();
  }
});
</script>
</body>
</html>
